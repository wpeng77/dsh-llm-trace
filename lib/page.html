<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Trace</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
header{flex:none;padding:9px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:14px;margin:0;font-weight:600}
input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:5px 9px;min-width:220px;font:inherit}
label{color:var(--dim);display:flex;gap:5px;align-items:center;cursor:pointer}
button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#list{width:38%;min-width:320px;overflow:auto;border-right:1px solid var(--line)}
#detail{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#meta{flex:none;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
#meta b{color:var(--fg);font-weight:600}
#tabs{flex:none;display:flex;padding:0 6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;padding:7px 11px;border:0;background:none;color:var(--dim);border-bottom:2px solid transparent;border-radius:0;cursor:pointer;font:inherit;white-space:nowrap}
.tab:hover{border-color:transparent;color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-size:11px;opacity:.65;margin-left:5px}
#pane{flex:1;min-height:0;overflow:auto;padding:11px 14px}
.row{padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#1c2128}
.row.sel{background:#1f2937;border-left:3px solid var(--accent);padding-left:11px}
.row .u{word-break:break-all}
.row .m{color:var(--dim);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.s2{color:var(--ok)}.s4{color:var(--warn)}.s5{color:var(--err)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin:0;white-space:pre-wrap;word-break:break-word}
table{border-collapse:collapse;width:100%}
td{padding:2px 8px 2px 0;vertical-align:top;border-bottom:1px solid #21262d}
td:first-child{color:var(--dim);white-space:nowrap;width:1%}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.bar .note{flex:1;min-width:180px}
.sec{margin:0 0 14px}
.sec h3{font-size:12px;margin:0 0 5px;color:var(--accent);font-weight:600}
.sec h3 span{color:var(--dim);font-weight:400;margin-left:6px}
.note{color:var(--dim);font-size:12px}
.empty{color:var(--dim);padding:24px;text-align:center}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-right:6px}
</style></head><body>
<header>
<h1>LLM Trace</h1>
<input id="q" type="search" placeholder="filter url / status / method">
<label><input id="auto" type="checkbox" checked> auto</label>
<button id="refresh">Refresh</button>
<span id="stats" class="note"></span>
</header>
<main>
<div id="list"><div class="empty">waiting for the first matching model call…</div></div>
<section id="detail">
<div id="meta">select an exchange</div>
<div id="tabs"></div>
<div id="pane"><div class="empty">select an exchange</div></div>
</section>
</main>
<script>
var BASE = location.pathname.replace(/\/+$/,'');
var entries = [];
var selected = null;
var tab = 'resbody';
var mode = 'assembled';
var detail = null;
var detailId = null;
var detailState = null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function bytes(n){if(n===undefined||n===null)return '-';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KiB';return (n/1048576).toFixed(1)+' MiB'}
function statusClass(s){if(s>=500)return 's5';if(s>=400)return 's4';if(s>=200)return 's2';return ''}
function shortPath(u){try{var x=new URL(u);return x.host+x.pathname}catch(e){return u}}
function ms(e){if(e.endedAt&&e.startedAt)return (e.endedAt-e.startedAt)+' ms';if(e.headersAt&&e.startedAt)return (e.headersAt-e.startedAt)+' ms+';return '…'}
function pretty(text){try{return JSON.stringify(JSON.parse(text),null,2)}catch(e){return text}}

/* Rebuild one readable view from a provider's SSE chunk stream. Every chunk
   repeats the whole JSON envelope, so keeping only the deltas drops the bulk. */
function assembleSse(raw){
  var a={reasoning:'',content:'',tools:[],finish:null,usage:null,chunks:0,done:false,broken:0};
  var lines=raw.split('\n');
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(l.slice(0,6)!=='data: ')continue;
    var p=l.slice(6).trim();
    if(p==='[DONE]'){a.done=true;continue}
    var c;
    try{c=JSON.parse(p)}catch(e){a.broken++;continue}
    a.chunks++;
    if(c.usage)a.usage=c.usage;
    var chs=c.choices||[];
    for(var j=0;j<chs.length;j++){
      var ch=chs[j],dl=ch.delta||{};
      if(dl.reasoning_content)a.reasoning+=dl.reasoning_content;
      if(dl.content)a.content+=dl.content;
      var tcs=dl.tool_calls||[];
      for(var k=0;k<tcs.length;k++){
        var tc=tcs[k],idx=(tc.index===undefined?0:tc.index);
        if(!a.tools[idx])a.tools[idx]={id:'',name:'',args:''};
        if(tc.id)a.tools[idx].id=tc.id;
        if(tc.function){
          if(tc.function.name)a.tools[idx].name+=tc.function.name;
          if(tc.function.arguments)a.tools[idx].args+=tc.function.arguments;
        }
      }
      if(ch.finish_reason)a.finish=ch.finish_reason;
    }
  }
  return a;
}

function renderList(){
  var el=document.getElementById('list');
  var q=document.getElementById('q').value.trim().toLowerCase();
  var rows=entries.filter(function(e){
    if(!q)return true;
    return (e.url+' '+(e.status===undefined?'':e.status)+' '+e.method).toLowerCase().indexOf(q)>=0;
  });
  if(!rows.length){el.innerHTML='<div class="empty">no matching exchange</div>';return}
  el.innerHTML=rows.map(function(e){
    return '<div class="row'+(e.id===selected?' sel':'')+'" data-id="'+e.id+'">'
      +'<div class="u">'+esc(shortPath(e.url))+'</div>'
      +'<div class="m"><span>'+esc(e.method)+'</span>'
      +'<span class="'+statusClass(e.status)+'">'+(e.status===undefined?esc(e.state):e.status)+'</span>'
      +'<span>'+esc(ms(e))+'</span>'
      +'<span>in '+bytes(e.requestBodyBytes)+'</span>'
      +'<span>out '+bytes(e.responseBodyBytes)+'</span>'
      +'<span>'+new Date(e.startedAt).toLocaleTimeString()+'</span></div></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('.row'),function(n){
    n.onclick=function(){selected=n.getAttribute('data-id');detail=null;detailId=null;renderList();ensureDetail()};
  });
}

function headersTable(pairs){
  if(!pairs||!pairs.length)return '<div class="note">none</div>';
  return '<table>'+pairs.map(function(p){return '<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>'}).join('')+'</table>';
}

function paneBar(note,rawToggle){
  var h='<div class="bar"><span class="note">'+note+'</span>';
  if(rawToggle){
    h+='<button id="mode">'+(mode==='assembled'?'Show raw SSE':'Show assembled')+'</button>';
  }
  h+='<button id="copy">Copy</button></div>';
  return h;
}

function renderPane(){
  var pane=document.getElementById('pane');
  if(!detail){pane.innerHTML='<div class="empty">select an exchange</div>';return}
  var h='';
  if(tab==='reqbody'){
    var rb=detail.requestBody||'';
    h+=paneBar(num(rb.length)+' chars'+(detail.requestTruncated?' · truncated':''),false);
    h+='<pre>'+esc(rb?pretty(rb):'(empty)')+'</pre>';
    if(detail.requestCaptureError)h+='<div class="note">capture error: '+esc(detail.requestCaptureError)+'</div>';
  }else if(tab==='resbody'){
    var raw=detail.responseBody||'';
    var isSse=(detail.mimeType||'').indexOf('event-stream')>=0;
    if(isSse&&mode==='assembled'){
      var a=assembleSse(raw);
      var payload=(a.reasoning.length+a.content.length)+a.tools.reduce(function(s,t){return s+(t.name.length+t.args.length)},0);
      var pct=raw.length?Math.round(payload*100/raw.length*10)/10:0;
      h+=paneBar(num(a.chunks)+' chunks · '+bytes(raw.length)+' raw → '+bytes(payload)+' payload ('+pct+'%)',true);
      if(a.broken)h+='<div class="note">'+a.broken+' incomplete trailing chunk(s) — the body was cut at the capture limit</div>';
      if(a.reasoning)h+='<div class="sec"><h3>Reasoning <span>'+bytes(a.reasoning.length)+'</span></h3><pre>'+esc(a.reasoning)+'</pre></div>';
      if(a.content)h+='<div class="sec"><h3>Content <span>'+bytes(a.content.length)+'</span></h3><pre>'+esc(a.content)+'</pre></div>';
      if(a.tools.length){
        h+='<div class="sec"><h3>Tool calls <span>'+a.tools.length+'</span></h3>';
        for(var i=0;i<a.tools.length;i++){
          var t=a.tools[i];
          h+='<div class="sec"><div class="note"><span class="pill">index '+i+'</span>'+esc(t.name||'(unnamed)')+(t.id?' · '+esc(t.id):'')+'</div><pre>'+esc(pretty(t.args||''))+'</pre></div>';
        }
        h+='</div>';
      }
      if(a.usage)h+='<div class="sec"><h3>Usage</h3><pre>'+esc(JSON.stringify(a.usage,null,2))+'</pre></div>';
      if(a.finish)h+='<div class="note">finish_reason: <b>'+esc(a.finish)+'</b>'+(a.done?' · stream closed with [DONE]':'')+'</div>';
      if(!a.reasoning&&!a.content&&!a.tools.length&&!a.usage)h+='<div class="empty">no delta content in this stream</div>';
    }else{
      h+=paneBar(num(raw.length)+' chars'+(detail.responseTruncated?' · truncated at the capture limit':''),isSse);
      h+='<pre>'+esc(raw||'(empty)')+'</pre>';
    }
    if(detail.responseCaptureError)h+='<div class="note">capture error: '+esc(detail.responseCaptureError)+'</div>';
  }else if(tab==='reqheaders'){
    h+=paneBar((detail.requestHeaders||[]).length+' headers',false);
    h+=headersTable(detail.requestHeaders);
  }else{
    h+=paneBar((detail.responseHeaders||[]).length+' headers',false);
    h+=headersTable(detail.responseHeaders);
  }
  pane.innerHTML=h;
  var mb=document.getElementById('mode');
  if(mb)mb.onclick=function(){mode=(mode==='assembled'?'raw':'assembled');renderPane()};
  var cb=document.getElementById('copy');
  if(cb)cb.onclick=function(){
    var t=tab==='reqbody'?pretty(detail.requestBody||''):tab==='resbody'?(detail.responseBody||''):JSON.stringify(tab==='reqheaders'?detail.requestHeaders:detail.responseHeaders,null,2);
    navigator.clipboard.writeText(t).then(function(){cb.textContent='Copied';setTimeout(function(){cb.textContent='Copy'},1200)},function(){cb.textContent='Copy failed'});
  };
}

function renderTabs(){
  var defs=[['reqbody','Request body',detail.requestBodyBytes],['resbody','Response body',detail.responseBodyBytes],['reqheaders','Request headers',(detail.requestHeaders||[]).length],['resheaders','Response headers',(detail.responseHeaders||[]).length]];
  var el=document.getElementById('tabs');
  el.innerHTML=defs.map(function(d){
    var badge=d[0].indexOf('headers')>=0?(d[2]+' hdrs'):bytes(d[2]);
    return '<button class="tab'+(tab===d[0]?' on':'')+'" data-t="'+d[0]+'">'+d[1]+'<i>'+badge+'</i></button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('.tab'),function(n){
    n.onclick=function(){tab=n.getAttribute('data-t');renderTabs();renderPane()};
  });
}

function renderMeta(){
  var e=detail;
  document.getElementById('meta').innerHTML=
    '<b>'+esc(e.method)+'</b> '+esc(e.url)+' · <span class="'+statusClass(e.status)+'">'+esc(e.status===undefined?e.state:e.status)+' '+esc(e.statusText||'')+'</span>'
    +' · '+esc(ms(e))+' · '+esc(e.mimeType||'-')
    +(e.error?' · <span class="s5">'+esc(e.error)+'</span>':'')
    +(e.canceled?' · <span class="s4">canceled</span>':'');
}

function ensureDetail(){
  if(!selected)return;
  var summary=entries.filter(function(e){return e.id===selected})[0];
  var want=summary?summary.state:'done';
  if(detailId===selected&&detailState===want)return;
  var id=selected;
  fetch(BASE+'/api/exchange?id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(e){
    if(e.error){detail=null;document.getElementById('pane').innerHTML='<div class="empty">'+esc(e.error)+'</div>';document.getElementById('meta').textContent='';document.getElementById('tabs').innerHTML='';return}
    detail=e;detailId=id;detailState=want;renderMeta();renderTabs();renderPane();
  });
}

function poll(){
  fetch(BASE+'/api/list').then(function(r){return r.json()}).then(function(d){
    entries=d.entries;
    document.getElementById('stats').textContent=d.stats.count+' / '+d.stats.maxRetained+' retained · '+bytes(d.stats.retainedBytes)+' of '+bytes(d.stats.maxJournalBytes);
    renderList();
    ensureDetail();
  }).catch(function(){document.getElementById('stats').textContent='host unreachable'});
}

document.getElementById('refresh').onclick=poll;
document.getElementById('q').oninput=renderList;
setInterval(function(){if(document.getElementById('auto').checked)poll()},2000);
poll();
</script></body></html>
